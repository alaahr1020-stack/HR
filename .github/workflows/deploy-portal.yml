name: Deploy portal (GitHub Pages)

on:
  push:
    paths: ['portal/**', '.github/workflows/deploy-portal.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # بيرفع البورتال بس من الفرع الرئيسي للريبو
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal
      - id: deployment
        uses: actions/deploy-pages@v4
